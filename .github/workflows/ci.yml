name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # --frozen: install exactly what uv.lock says and never rewrite it
      - run: uv sync --frozen
      - run: uv run --frozen --with pytest pytest -q
